[package]
name = "rom-ui-gallery-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
[workspace]
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rom-studio-host = { version = "=0.1.0" }
rom-identity = { version = "=0.1.0" }
rom = { version = "=0.1.0" }
rom-sqlite = { version = "=0.1.0" }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
[dev-dependencies]
tempfile = "=3.27.0"
